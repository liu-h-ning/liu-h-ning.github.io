      <h1>一次论文复现实验的记录模板</h1>
      <div class="post-meta">
        <time datetime="2026-07-12">2026-07-12</time>
        <span>工具</span>
      </div>

      <p>复现实验最怕“当时好像改过什么”。记录模板的目标不是写得漂亮，而是让未来的自己能准确回到现场。</p>

      <h2>基本信息</h2>
      <ul>
        <li>论文题目、作者、年份、链接。</li>
        <li>代码仓库、提交版本、运行环境。</li>
        <li>数据来源、数据版本、预处理步骤。</li>
      </ul>

      <h2>实验过程</h2>
      <ul>
        <li>运行命令与参数。</li>
        <li>报错信息与解决方法。</li>
        <li>与原论文结果的差异。</li>
      </ul>

      <h2>结果解释</h2>
      <p>最后补一段主观判断：哪些结果可信，哪些结果仍然可疑，下一次复现应该优先检查什么。</p>
    </article>
