      <h1>公开写作给学术训练带来的节奏感</h1>
      <div class="post-meta">
        <time datetime="2026-06-30">2026-06-30</time>
        <span>随笔</span>
      </div>

      <p>学术写作不必总等到“足够成熟”才开始。公开写作的意义之一，是给研究训练安排一个更稳定的反馈节奏。</p>

      <h2>短札</h2>
      <p>短札适合记录一个概念、一段方法比较、一个数据问题或一次实验失败。它不要求完整，却要求具体。</p>

      <h2>复盘</h2>
      <p>定期复盘可以发现哪些问题反复出现，哪些材料正在聚集，哪些判断已经过时。</p>

      <h2>边界</h2>
      <p>公开不等于把所有未发表内容都放出来。涉及投稿、合作和数据权限的内容，需要保留必要边界。</p>
    </article>
