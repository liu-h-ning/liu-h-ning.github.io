      <h1>知识图谱在课程资源组织中的作用</h1>
      <div class="post-meta">
        <time datetime="2026-07-20">2026-07-20</time>
        <span>研究</span>
      </div>

      <p>课程资源经常以课件、论文、案例、作业和课堂讨论的形式分散存在。知识图谱提供了一种轻量的组织方式：让资源之间的关系显性化。</p>

      <h2>节点</h2>
      <p>节点可以是概念、论文、案例、数据集、课堂活动或评价任务。节点越贴近真实使用场景，越容易被学生和教师复用。</p>

      <h2>关系</h2>
      <p>关系可以描述“前置知识”“支持证据”“应用案例”“对比方法”等连接。关系不是装饰，它决定了学习者如何从一个材料自然走向另一个材料。</p>

      <h2>证据</h2>
      <p>每个节点和关系都应保留来源。对学术课程而言，证据链比漂亮的图更重要。</p>
